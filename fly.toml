app = "wbc-procurement-audit-planner"
primary_region = "lax"

[build]

[env]
  RUN_BUDGET_USD = "40"

[mounts]
  source = "runs_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # runs take about an hour with no web traffic, so the machine must not stop on idle
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
